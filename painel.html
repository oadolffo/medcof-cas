<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel CAs · MedCof</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/proposta.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%234f46e5'/><text x='16' y='22' font-size='16' text-anchor='middle' fill='white' font-family='Arial' font-weight='700'>CA</text></svg>">
</head>
<body>
<!-- Login -->
<div id="authView" class="auth hidden">
  <div class="card">
    <a class="logo" href="/">Med<b>Cof</b> · Painel CAs</a>
    <p class="muted small" style="margin:6px 0 18px">Área interna da equipe MedCof.</p>
    <form id="authForm">
      <div class="field hidden" id="nameField"><label>Seu nome</label><input name="nome" autocomplete="name"></div>
      <div class="field"><label>E-mail</label><input name="email" type="email" required autocomplete="email"></div>
      <div class="field"><label>Senha</label><input name="senha" type="password" required minlength="6" autocomplete="current-password"></div>
      <div id="authErr" class="alert err hidden" style="margin-bottom:12px"></div>
      <div id="authOk" class="alert ok hidden" style="margin-bottom:12px"></div>
      <button class="btn primary" style="width:100%;justify-content:center" id="authBtn">Entrar</button>
    </form>
    <p class="small muted" style="margin:14px 0 0;text-align:center"><a href="#" id="toggleAuth">Criar conta</a> · <a href="#" id="forgot">Esqueci a senha</a></p>
  </div>
</div>

<!-- Aguardando aprovação -->
<div id="pendingView" class="auth hidden">
  <div class="card" style="text-align:center">
    <div style="font-size:36px">⏳</div>
    <h2>Aguardando aprovação</h2>
    <p class="muted">Sua conta foi criada. Um administrador precisa liberar seu acesso ao painel.</p>
    <button class="btn" onclick="logout()">Sair</button>
  </div>
</div>

<!-- App -->
<div id="appView" class="app hidden">
  <aside class="side">
    <a class="logo" href="/">Med<b>Cof</b> CAs</a>
    <div class="grp">Parcerias</div>
    <button class="nav on" data-view="home"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg>Visão geral</button>
    <button class="nav" data-view="cas"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10l9-6 9 6"/><path d="M5 10v9M19 10v9M9 10v9M15 10v9M3 21h18"/></svg>Centros acadêmicos</button>
    <button class="nav" data-view="pipeline"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="11" rx="1.5"/><rect x="17" y="4" width="4" height="7" rx="1.5"/></svg>Funil</button>
    <button class="nav" data-view="mapa"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4l-6 2.5v13.5l6-2.5 6 2.5 6-2.5V4l-6 2.5z"/><path d="M9 4v13.5M15 6.5V20"/></svg>Mapa do Brasil</button>
    <div class="grp">Operação</div>
    <button class="nav" data-view="eventos"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>Eventos <span class="count hidden" id="pendCount"></span></button>
    <button class="nav" data-view="postagens"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".8"/></svg>Postagens <span class="count hidden" id="postCount"></span></button>
    <button class="nav" data-view="reunioes"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17" cy="9" r="2.5"/><path d="M16.5 14.2A5 5 0 0 1 21.5 19"/></svg>Reuniões <span class="count hidden" id="reuCount"></span></button>
    <button class="nav" data-view="contratos"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>Contratos <span class="count hidden" id="ctCount"></span></button>
    <button class="nav" data-view="atleticas"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21h8M12 17v4"/><circle cx="12" cy="9" r="6"/><path d="M12 3v12M6.5 6.5c3 2 8 2 11 0M6.5 11.5c3-2 8-2 11 0"/></svg>Atléticas</button>
    <button class="nav" data-view="engajamento"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4"/></svg>Engajamento</button>
    <button class="nav ownerOnly hidden" data-view="equipe"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Equipe <span class="count hidden" id="teamCount"></span></button>
    <span class="spacer"></span>
    <div class="sep"></div>
    <a class="nav" href="/manual" target="_blank"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5M19 19v2H6"/></svg>Manual do CA</a>
    <a class="nav" href="/interesse" target="_blank"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>Formulário de interesse</a>
    <button class="nav" onclick="toggleTheme()"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 0 0 17z" fill="currentColor"/></svg>Tema</button>
    <div class="small muted" style="padding:8px 10px" id="whoami"></div>
    <button class="nav" onclick="logout()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 16l-4-4 4-4M6 12h10"/></svg>Sair</button>
  </aside>
  <div>
    <nav class="mobile-nav">
      <button class="nav on" data-view="home">Visão geral</button>
      <button class="nav" data-view="cas">CAs</button>
      <button class="nav" data-view="pipeline">Funil</button>
      <button class="nav" data-view="eventos">Eventos</button>
      <button class="nav" data-view="mapa">Mapa</button>
      <button class="nav" data-view="contratos">Contratos</button>
      <button class="nav" data-view="atleticas">Atléticas</button>
      <button class="nav" data-view="postagens">Posts</button>
      <button class="nav" data-view="reunioes">Reuniões</button>
      <button class="nav" data-view="engajamento">Ranking</button>
      <button class="nav ownerOnly hidden" data-view="equipe">Equipe</button>
      <button class="nav" onclick="logout()">Sair</button>
    </nav>
    <main class="main" id="main"><div class="empty">Carregando…</div></main>
  </div>
</div>

<div id="drawerRoot"></div>
<div id="modalRoot"></div>

<script src="/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/common.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/admin.js"></script>
<script src="/proposta.js"></script>
<script src="/proposta-admin.js"></script>
<script src="/painel.js"></script>
</body>
</html>
