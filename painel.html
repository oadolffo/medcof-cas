<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel CAs · MedCof</title>
<meta name="robots" content="noindex">
<meta name="darkreader-lock">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/proposta.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23e2263c'/><text x='16' y='22' font-size='16' text-anchor='middle' fill='white' font-family='Arial' font-weight='700'>CA</text></svg>">
</head>
<body>
<!-- Login -->
<div id="authView" class="auth hidden">
  <div class="card">
    <a class="logo" href="/">Med<b>Cof</b> · Painel CAs</a>
    <p class="muted small" style="margin:6px 0 18px">Área interna da equipe MedCof.</p>
    <form id="authForm">
      <div class="field hidden" id="nameField"><label>Seu nome</label><input name="nome" autocomplete="name"></div>
      <div class="field"><label>E-mail</label><input name="email" type="email" required autocomplete="email"></div>
      <div class="field"><label>Senha</label><input name="senha" type="password" required minlength="6" autocomplete="current-password"></div>
      <div id="authErr" class="alert err hidden" style="margin-bottom:12px"></div>
      <div id="authOk" class="alert ok hidden" style="margin-bottom:12px"></div>
      <button class="btn primary" style="width:100%;justify-content:center" id="authBtn">Entrar</button>
    </form>
    <p class="small muted" style="margin:14px 0 0;text-align:center"><a href="#" id="toggleAuth">Criar conta</a> · <a href="#" id="forgot">Esqueci a senha</a></p>
  </div>
</div>

<!-- Aguardando aprovação -->
<div id="pendingView" class="auth hidden">
  <div class="card" style="text-align:center">
    <div style="font-size:36px">⏳</div>
    <h2>Aguardando aprovação</h2>
    <p class="muted">Sua conta foi criada. Um administrador precisa liberar seu acesso ao painel.</p>
    <button class="btn" onclick="logout()">Sair</button>
  </div>
</div>

<!-- App -->
<div id="appView" class="app hidden">
  <header class="top">
    <a class="brand" href="/"><img src="/img/furacao-branco.png" alt=""><div>Centros Acadêmicos<small>MedCof</small></div></a>
    <nav class="pills" aria-label="Seções">
      <button class="on" data-view="home">Visão geral</button>
      <button data-view="cas">CAs</button>
      <button data-view="pipeline">Funil</button>
      <button data-view="eventos">Eventos <span class="count hidden" id="pendCount"></span></button>
      <button data-view="mapa">Mapa</button>
      <button data-view="contratos">Contratos <span class="count hidden" id="ctCount"></span></button>
      <button data-view="atleticas">Atléticas</button>
      <button data-view="postagens">Postagens <span class="count hidden" id="postCount"></span></button>
      <button data-view="reunioes">Reuniões <span class="count hidden" id="reuCount"></span></button>
      <button data-view="engajamento">Engajamento</button>
      <button class="ownerOnly hidden" data-view="equipe">Equipe <span class="count hidden" id="teamCount"></span></button>
    </nav>
    <div class="tools">
      <a class="circle" href="/manual" target="_blank" title="Manual do CA" aria-label="Manual do CA"><svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5M19 19v2H6"/></svg></a>
      <a class="circle" href="/interesse" target="_blank" title="Formulário de interesse" aria-label="Formulário de interesse"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M8 12h8M8 16h5"/></svg></a>
      <button class="circle" data-view="config" title="Configurações" aria-label="Configurações"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg></button>
      <button class="circle" onclick="toggleTheme()" title="Tema" aria-label="Alternar tema"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 0 0 17z" fill="currentColor"/></svg></button>
      <button class="circle me" onclick="logout()" title="Sair" aria-label="Sair"><span id="whoami"></span></button>
    </div>
  </header>
  <main class="main" id="main"><div class="empty">Carregando…</div></main>
</div>

<div id="drawerRoot"></div>
<div id="modalRoot"></div>

<script src="/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/common.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/admin.js"></script>
<script src="/proposta.js"></script>
<script src="/proposta-admin.js"></script>
<script src="/painel.js"></script>
</body>
</html>
